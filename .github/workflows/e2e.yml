name: E2E

# The app against the REAL Supertext API (secret SUPERTEXT_API_KEY):
# 1. test/e2e/features.mjs: the language pairs the demo store translates are offered (GET features);
# 2. test/e2e/live.e2e.ts: the Translate page's own loader and action, the background job runner,
#    a PostgreSQL database and the bundled SDK translate a sample shop into every language. Only
#    Shopify is a stand-in (test/e2e/shopify-stand-in.ts): a real store can't be used from CI.
# No docs screenshots here: the app has no screenshot script yet.
# See "End-to-end tests" in docs/DEVELOPER.md.

on:
  workflow_dispatch:
  # A pull request that changes the E2E test itself runs it before merging.
  pull_request:
    paths:
      - 'test/e2e/**'
      - '.github/workflows/e2e.yml'
  schedule:
    - cron: '13 6 * * 1' # Mondays, 06:13 UTC
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'vendor/**'
      - 'prisma/**'
      - 'package.json'
      - 'package-lock.json'
      - 'test/**'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    name: E2E (live API)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shopify_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Check for the API key
        id: key
        env:
          SUPERTEXT_API_KEY: ${{ secrets.SUPERTEXT_API_KEY }}
        run: |
          if [ -n "$SUPERTEXT_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secret SUPERTEXT_API_KEY is not set: skipping the tests against the real Supertext API (see docs/DEVELOPER.md → End-to-end tests)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the app
        if: steps.key.outputs.present == 'true'
        run: |
          npm ci --no-audit --no-fund
          npx prisma generate

      - name: Language list against the real API
        if: steps.key.outputs.present == 'true'
        env:
          SUPERTEXT_API_KEY: ${{ secrets.SUPERTEXT_API_KEY }}
          E2E_SOURCE: en
          E2E_TARGETS: de-CH,fr-CH
        run: node test/e2e/features.mjs

      - name: End-to-end test against the real API
        if: steps.key.outputs.present == 'true'
        env:
          SUPERTEXT_API_KEY: ${{ secrets.SUPERTEXT_API_KEY }}
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/shopify_e2e
        run: |
          npx prisma migrate deploy
          npm run test:e2e

      - name: Collect logs for debugging
        if: failure()
        run: |
          mkdir -p e2e-debug
          cp -r test/e2e/artifacts e2e-debug/ 2>/dev/null || true

      - name: Upload logs for debugging
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-debug
          path: e2e-debug/
          retention-days: 7
