version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Major versions we can't take yet (see docs/DEVELOPER.md):
    ignore:
      - dependency-name: "typescript"  # TypeScript 7 is the native compiler; vue-tsc and the build tooling still need 5.x
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"  # types must match the oldest supported Node version, not the newest
        update-types: ["version-update:semver-major"]
      # React Router moves as one family; @shopify/shopify-app-react-router 3.x
      # peers react-router ^7, and RR 8 needs Node >=22.22 (we promise >=22.12)
      - dependency-name: "react-router"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@react-router/*"
        update-types: ["version-update:semver-major"]
      # @shopify/shopify-app-session-storage-prisma 11.x peers prisma ^6
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      # @typescript-eslint/parser and /eslint-plugin must share one version: update both by hand
      - dependency-name: "@typescript-eslint/*"
        update-types: ["version-update:semver-major"]
      # @shopify/app-bridge-react peers react ^18 at most
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # ESLint 10 drops .eslintrc: migrate to eslint.config.js first
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
